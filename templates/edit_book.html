<!DOCTYPE html>
<html>

<head>
    <title>Edit Book</title>
</head>

<body>

    <h1>Edit Book</h1>

    <form method="POST">

        <label>ISBN:</label><br>
        <input
            type="text"
            name="isbn"
            value="{{ book['isbn'] }}"
        >

        <br><br>

        <label>Book Title:</label><br>
        <input
            type="text"
            name="title"
            value="{{ book['title'] }}"
            required
        >

        <br><br>

        <label>Author:</label><br>
        <input
            type="text"
            name="author"
            value="{{ book['author'] }}"
        >

        <br><br>

        <label>Subject:</label><br>
        <input
            type="text"
            name="subject"
            value="{{ book['subject'] }}"
        >

        <br><br>

        <label>Category:</label><br>
        <input
            type="text"
            name="category"
            value="{{ book['category'] }}"
        >

        <br><br>

        <label>Quantity:</label><br>
        <input
            type="number"
            name="quantity"
            value="{{ book['quantity'] }}"
            min="1"
            required
        >

        <br><br>

        <button type="submit">
            UPDATE BOOK
        </button>

    </form>

    <br>

    <a href="/books">
        CANCEL
    </a>

</body>

</html>
